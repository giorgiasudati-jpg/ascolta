<!doctype html><html lang="it"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Ascolta</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ascolta">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" id="theme-color" content="#F7DCC8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
</head><body>
<style>
/* Layout: "inchiostro su carta". Un solo inchiostro per mese su una carta del suo colore, un'unica famiglia (Archivo) usata larga e pesante per i titoli e leggera per il testo, linee sottili al posto dei riquadri, barra a pillola in basso. Le note scritte da Giorgia sono segnate da una linea a margine. */
:root{
  /* la coppia del mese arriva da JS (applyMonth); questi sono i valori di ottobre come riserva */
  --hue-paper:#F7DCC8; --hue-ink:#9C3009;
  --paper:var(--hue-paper); --ink:var(--hue-ink);
  --f:"Archivo",system-ui,-apple-system,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:color-mix(in srgb,var(--hue-ink) 30%,#0c0c0c); --ink:var(--hue-paper); color-scheme:dark}}
:root[data-theme="dark"]{--paper:color-mix(in srgb,var(--hue-ink) 30%,#0c0c0c); --ink:var(--hue-paper); color-scheme:dark}
:root{
  --ink-2:color-mix(in srgb,var(--ink) 88%,var(--paper));   /* testo secondario, sempre leggibile */
  --rule:color-mix(in srgb,var(--ink) 38%,var(--paper));    /* linee sottili */
  --ghost:color-mix(in srgb,var(--ink) 24%,var(--paper));   /* numeri grandi tono su tono */
  --tint:color-mix(in srgb,var(--ink) 9%,var(--paper));     /* campiture leggere */
  /* nomi della versione precedente, ancora usati dentro il codice di rete e legende */
  --deep:var(--ink); --groove:var(--tint); --card:var(--paper); --line:var(--rule); --muted:var(--ink-2); --amber:var(--ink); --sea:var(--ink-2); --rust:var(--ink);
}

*{box-sizing:border-box}
html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;margin:0;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:inherit;line-height:1.05}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
.muted{color:var(--ink-2)}
.mono{font-variant-numeric:tabular-nums}

/* tipografia: tre registri della stessa famiglia */
.display,.ph h1{font-stretch:125%;font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
h2{font-stretch:112%;font-weight:750;font-size:1.3rem;letter-spacing:-.01em}
h3{font-weight:650;font-size:1.05rem}
.eyebrow{font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.nota{display:block;padding-left:12px;border-left:2px solid var(--ink);color:var(--ink);font-size:.98rem;line-height:1.45}

/* testata minima */
header.top{padding-block:14px 0}
.top-row{display:flex;align-items:baseline;gap:10px}
.mark{font-stretch:125%;font-weight:900;font-size:1rem;letter-spacing:-.01em}
.month{font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.sync{margin-left:auto;font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.sync:empty{display:none}

/* illustrazioni a linea, nel colore dell'inchiostro, con il tratto un po' tremolante del disegno a mano */
.ill{display:block;color:var(--ink);overflow:visible}
.ill .fill{fill:var(--ink);stroke:none}
.ill .paper{fill:var(--paper)}
.ill .spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ph-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.ph-top .ill{width:104px;height:104px;flex:none;margin-bottom:-14px}
.empty .ill{width:120px;height:120px;margin:0 0 4px -8px}
.login .ill{width:150px;height:150px;margin-left:-10px}

/* titolo di pagina, stile manifesto */
.ph{display:flex;flex-direction:column;gap:6px;padding-top:22px}
.ph h1{font-size:clamp(2.7rem,13vw,5.2rem);line-height:.9;overflow-wrap:anywhere}
.ph p{color:var(--ink-2);max-width:52ch;margin-top:6px}

main{padding-block:0 calc(150px + var(--safe-b))}
.view{display:flex;flex-direction:column;gap:40px}
.block{display:flex;flex-direction:column;gap:14px}
.block-head{display:flex;flex-direction:column;gap:6px;max-width:60ch;padding-top:12px;border-top:1.5px solid var(--ink)}
.block-head p{color:var(--ink-2);font-size:.94rem}

/* barra in basso a pillola */
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--safe-b));z-index:15;max-width:520px;margin:0 auto}
nav.tabs [role=tablist]{display:flex;gap:2px;padding:4px;border:1.5px solid var(--ink);border-radius:999px;background:color-mix(in srgb,var(--paper) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tab{flex:1;min-height:42px;padding:0 4px;border:0;border-radius:999px;background:none;cursor:pointer;font-size:.8rem;font-weight:600;letter-spacing:.02em;text-transform:lowercase;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.fab{position:fixed;right:max(18px,calc(50% - 360px));bottom:calc(76px + var(--safe-b));z-index:15;width:58px;height:58px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);font-size:2rem;font-weight:300;line-height:1;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--ink) 25%,transparent)}
.fab:active{transform:scale(.95)}

/* pulsanti */
.btn{min-height:40px;font-size:.84rem;font-weight:600;padding:0 18px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{min-height:36px;font-size:.78rem;padding:0 14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.97)}
.linkbtn{background:none;border:0;padding:6px 0;font-size:.74rem;font-weight:600;color:var(--ink-2);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn.warn{color:var(--ink)}

/* tipo di giornata: segmenti a pillola */
.daytype{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1.5px solid var(--ink);border-radius:999px;padding:3px;max-width:480px}
.dt{border:0;background:none;border-radius:999px;min-height:40px;padding:0 6px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--ink)}
.dt span{display:none}
.dt[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.daydesc{font-size:.88rem;color:var(--ink-2)}

/* il piano di oggi: righe separate da linee */
.plan{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:end;padding:16px 0;border-bottom:1px solid var(--rule)}
.task:first-child{border-top:1px solid var(--rule)}
.task .kind{grid-column:1/-1;justify-self:start;font-size:.64rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1.5px solid var(--ink)}
.task.att .kind{background:var(--ink);color:var(--paper)}
.task h3{font-stretch:112%;font-weight:750;font-size:1.35rem;letter-spacing:-.01em;overflow-wrap:anywhere;margin-top:6px}
.task .artist{font-size:.92rem;color:var(--ink-2)}
.task .why{font-size:.88rem;color:var(--ink-2);margin-top:6px}
.task .bar{margin-top:10px;max-width:260px}
.task.done{opacity:.55}
.task.done .kind{background:none;color:var(--ink)}

/* carte dei dischi: niente scatola, solo una linea sopra */
.cards{display:grid;grid-template-columns:1fr;gap:0}
.card{padding:18px 0;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:10px;min-width:0}
.card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card-head h3{font-stretch:112%;font-weight:750;font-size:1.2rem;overflow-wrap:anywhere}
.artist{font-size:.92rem;color:var(--ink-2)}
.pill{flex:none;font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1.5px solid var(--ink);white-space:nowrap}
.pill.primo{background:var(--ink);color:var(--paper)}
.pill.coda{border-style:dashed;border-color:var(--rule);color:var(--ink-2)}
.from{font-size:.74rem;color:var(--ink-2)}

/* la barra delle 8 tappe, con il numero grande tono su tono */
.bar{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.bar i{height:6px;background:var(--tint);border-radius:999px}
.bar i.on{background:color-mix(in srgb,var(--ink) var(--k),var(--tint))}
.bar-meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.74rem;color:var(--ink-2);flex-wrap:wrap}
.bar-meta .big{font-weight:200;font-size:2.4rem;line-height:.9;color:var(--ghost);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.bar-meta .big small{font-size:.45em;font-weight:300}
.lenses{display:flex;flex-wrap:wrap;gap:4px}
.lenses span{font-size:.64rem;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2)}
.lenses span.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.next{font-size:.92rem}
.next b{font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* il flusso */
.flow{display:grid;grid-template-columns:1fr;gap:22px}
.lane{display:flex;flex-direction:column;gap:0;min-width:0}
.lane>.eyebrow{display:flex;justify-content:space-between;padding-bottom:8px}
.mini{padding:12px 0;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:6px;min-width:0}
.mini b{font-weight:700}
.mini .m{font-size:.76rem;color:var(--ink-2)}
.mini.slot{color:var(--ink-2);font-size:.86rem;border-top-style:dashed}
.mini .bar i{height:4px}

.seed{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:14px 0;border-top:1px solid var(--rule)}
.seed b{font-weight:700}
.seed p{font-size:.88rem;color:var(--ink-2)}

/* la settimana, a sette colonne come un planner */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1.5px solid var(--ink);border-bottom:1px solid var(--rule)}
.week div{display:flex;flex-direction:column;align-items:stretch;gap:0;font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);text-align:center;border-left:1px solid var(--rule)}
.week div:first-child{border-left:0}
.week i{height:56px;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;gap:3px;padding:8px 0;font-style:normal}
.week div.today{color:var(--paper);background:var(--ink)}
.week div.today i em{border-color:var(--paper)}
.week div.today i em.a{background:var(--paper)}
.week em{display:block;width:14px;height:8px;border-radius:2px;border:1.5px solid var(--ink)}
.week em.a{background:var(--ink)}
.week .dl{padding:6px 0 0}
.weeksum{font-size:.94rem}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;padding-top:6px}
.stats div{display:flex;flex-direction:column;gap:2px;padding-right:6px}
.stats b{font-weight:200;font-size:2.6rem;line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stats span{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}

.empty{border-top:1px dashed var(--rule);padding:16px 0;color:var(--ink-2);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.empty b{color:var(--ink);font-weight:700}

.qlist{list-style:none;margin:0;padding:0;counter-reset:q}
.qlist li{counter-increment:q;display:grid;grid-template-columns:2.6rem minmax(0,1fr);gap:8px 10px;padding:14px 0;border-top:1px solid var(--rule);align-items:start}
.qlist li::before{content:counter(q,decimal-leading-zero);font-weight:200;font-size:1.7rem;line-height:1;color:var(--ghost);font-variant-numeric:tabular-nums}
.qlist li .actions{grid-column:2}
.qlist b{font-weight:700}
.qlist p{font-size:.86rem;color:var(--ink-2)}

details.add{border-top:1.5px solid var(--ink);margin-top:8px}
details.add summary{cursor:pointer;padding:14px 0;font-weight:700;font-size:.9rem;list-style:none}
details.add summary::-webkit-details-marker{display:none}
.form{display:grid;grid-template-columns:1fr;gap:14px;padding:0 0 16px}
.form .wide{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.64rem;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.12em}
label.f input,label.f select,label.f textarea{font-family:var(--f);font-size:16px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink);background:transparent;border:1.5px solid var(--rule);border-radius:12px;padding:10px 12px;width:100%;min-height:44px;-webkit-appearance:none;appearance:none}
label.f select{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--ink);outline:none}
label.f textarea{min-height:96px;resize:vertical}
.lens-hint{font-size:.9rem;color:var(--ink-2)}
fieldset.seg{border:0;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
fieldset.seg legend{font-size:.64rem;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px}
.seg label{border:1.5px solid var(--rule);border-radius:14px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start;font-weight:700}
.seg label:has(input:checked){border-color:var(--ink);background:var(--ink);color:var(--paper)}
.seg label:has(input:checked) small{color:var(--paper);opacity:.85}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg small{display:block;font-size:.76rem;font-weight:400;color:var(--ink-2);margin-top:2px}

.newdisc{display:grid;grid-template-columns:1fr 1fr;gap:12px;border:1.5px dashed var(--rule);border-radius:14px;padding:12px}
.history{list-style:none;margin:0;padding:0;font-size:.9rem}
.history li{padding:8px 0;border-top:1px solid var(--rule)}
.history .mono{font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}

/* rete */
.net{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
.net-box{position:relative;border-top:1.5px solid var(--ink);border-bottom:1px solid var(--rule);overflow:hidden}
#graph{display:block;width:100%;height:440px;touch-action:none;cursor:grab}
.node-label{font-family:var(--f);font-size:10.5px;font-weight:600;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.72rem;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
aside.side{position:static}

/* diario */
.heat-wrap{overflow-x:auto;scrollbar-width:none}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;width:max-content}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--tint)}
.heat i.l1{background:color-mix(in srgb,var(--ink) 35%,var(--tint))}
.heat i.l2{background:color-mix(in srgb,var(--ink) 65%,var(--tint))}
.heat i.l3{background:var(--ink)}
.heat i.today{outline:1.5px solid var(--ink);outline-offset:1px}
.days{display:flex;flex-direction:column;gap:28px}
.day h3{font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);padding-bottom:6px}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:14px 0;border-top:1px solid var(--rule)}
.entry .when{grid-column:1/-1;font-size:.64rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.entry b{font-weight:700}
.entry .lens{display:inline-block;font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-left:8px;padding:2px 7px;border-radius:999px;border:1px solid var(--ink);vertical-align:2px}
.entry .note{margin-top:6px;white-space:pre-wrap}
.entry .trk{font-size:.86rem;color:var(--ink-2);margin-top:2px}

/* metodo */
.method{display:grid;grid-template-columns:1fr;gap:0}
.method div{padding:14px 0;border-top:1px solid var(--rule)}
.method b{font-weight:700;display:block;margin-bottom:2px}
.method p{font-size:.9rem;color:var(--ink-2)}

/* accesso */
.login{max-width:420px;display:flex;flex-direction:column;gap:18px}
.login form{display:flex;flex-direction:column;gap:14px}

dialog{border:1.5px solid var(--ink);border-radius:22px;background:var(--paper);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:color-mix(in srgb,var(--ink) 35%,transparent)}
dialog form{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:22px 18px}
dialog h2{grid-column:1/-1;font-stretch:125%;font-weight:900;text-transform:uppercase;font-size:1.5rem}
dialog .wide{grid-column:1/-1}
dialog .actions{grid-column:1/-1;justify-content:flex-end;padding-top:4px}

.toast{position:fixed;left:50%;bottom:calc(150px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:.84rem;font-weight:600;padding:11px 18px;border-radius:999px;z-index:20;max-width:calc(100vw - 32px);text-align:center}
.notice{border-top:1.5px solid var(--ink);padding:14px 0;font-size:.95rem}

/* schermi più larghi: più colonne dove servono */
@media (min-width:640px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
  .flow{grid-template-columns:1.1fr 1.3fr 1fr;gap:24px}
  .form{grid-template-columns:repeat(2,minmax(0,1fr))}
  .method{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
  .seed{grid-template-columns:minmax(0,1fr) auto;align-items:center}
  .qlist li{grid-template-columns:2.6rem minmax(0,1fr) auto}
  .qlist li .actions{grid-column:auto}
  .dt span{display:inline}
  .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (min-width:900px){
  .net{grid-template-columns:minmax(0,1fr) 300px}
  aside.side{position:sticky;top:24px}
  #graph{height:540px}
}
@media (max-width:420px){
  dialog form{grid-template-columns:1fr}
  .newdisc{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="hand" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="1" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.8"/></filter></svg>
<header class="top">
  <div class="wrap top-row"><span class="mark">ascolta</span><span class="month" id="month"></span><span class="sync" id="sync" aria-live="polite"></span></div>
</header>

<main class="wrap" id="main">
  <div class="empty"><b>Sto aprendo i tuoi dischi…</b><span>Qui compare il tuo ascolto di oggi, scelto in base a com'è la giornata.</span></div>
</main>

<dialog id="dlg" aria-labelledby="dlg-title">
  <form id="log-form" novalidate>
    <h2 id="dlg-title">Segna un ascolto</h2>
    <label class="f wide" for="lf-disc">Disco<select id="lf-disc" required></select></label>
    <div class="wide newdisc" id="lf-new" hidden>
      <label class="f" for="lf-n-title">Titolo<input id="lf-n-title" autocomplete="off"></label>
      <label class="f" for="lf-n-artist">Artista<input id="lf-n-artist" autocomplete="off"></label>
      <label class="f" for="lf-n-year">Anno<input id="lf-n-year" inputmode="numeric" autocomplete="off" placeholder="facoltativo"></label>
      <label class="f" for="lf-n-dest">Dopo questo ascolto<select id="lf-n-dest"><option value="scoperta">Lo tengo tra le scoperte</option><option value="coda">Lo metto in coda</option></select></label>
    </div>
    <fieldset class="seg wide">
      <legend>Che ascolto è stato</legend>
      <label for="lf-t-att"><input type="radio" name="lf-type" id="lf-t-att" value="attento" checked><span>Attento<small>Il disco intero, con una lente</small></span></label>
      <label for="lf-t-pas"><input type="radio" name="lf-type" id="lf-t-pas" value="passaggio"><span>Di passaggio<small>In tragitto o mentre fai altro</small></span></label>
    </fieldset>
    <label class="f" for="lf-date">Giorno<input type="date" id="lf-date" required></label>
    <label class="f" for="lf-moment">Momento
      <select id="lf-moment"><option value="mattina">Mattina</option><option value="pomeriggio">Pomeriggio</option><option value="sera">Sera</option><option value="notte">Notte</option></select>
    </label>
    <label class="f wide" for="lf-lens" id="lf-lens-wrap">Lente di questo ascolto<select id="lf-lens"></select></label>
    <p class="lens-hint wide" id="lf-hint"></p>
    <label class="f wide" for="lf-track">Il brano che ti ha colpito<input id="lf-track" autocomplete="off" placeholder="facoltativo"></label>
    <label class="f wide" for="lf-note">Cosa hai sentito di nuovo<textarea id="lf-note" placeholder="Facoltativo. Un dettaglio, un'idea per JOSS, una domanda per il prossimo ascolto"></textarea></label>
    <div class="actions">
      <button type="button" class="btn ghost" id="lf-cancel">Annulla</button>
      <button type="submit" class="btn" id="lf-save">Salva ascolto</button>
    </div>
  </form>
</dialog>

<nav class="tabs" aria-label="Sezioni">
  <div role="tablist">
    <button class="tab" role="tab" data-tab="oggi" aria-selected="true">oggi</button>
    <button class="tab" role="tab" data-tab="dischi" aria-selected="false">dischi</button>
    <button class="tab" role="tab" data-tab="rete" aria-selected="false">rete</button>
    <button class="tab" role="tab" data-tab="diario" aria-selected="false">diario</button>
    <button class="tab" role="tab" data-tab="metodo" aria-selected="false">metodo</button>
  </div>
</nav>
<button class="fab" id="log-any" aria-label="Segna un ascolto">+</button>

<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="store.js"></script>
<script>
const LENSES=[
 {id:"insieme",name:"Insieme",hint:"Dall'inizio alla fine, senza fermarti. Che sensazione ti lascia il disco intero?"},
 {id:"testi",name:"Testi",hint:"Segui le parole. Di cosa parla davvero ogni brano, e chi parla?"},
 {id:"voce",name:"Voce e melodia",hint:"Dove respira la voce, come cambia timbro, quali linee ti restano in testa."},
 {id:"ritmo",name:"Ritmo",hint:"Batteria e basso: il groove, le pause, dove spinge e dove trattiene."},
 {id:"armonia",name:"Armonia",hint:"Gli accordi: dove ti sorprendono, dove si risolvono, cosa torna."},
 {id:"arrangiamento",name:"Arrangiamento",hint:"Chi suona cosa e quando entra. Come cresce e come si svuota un brano."},
 {id:"produzione",name:"Produzione",hint:"Spazio, riverberi, dinamica, scelte di suono e di missaggio."},
 {id:"contesto",name:"Contesto",hint:"Crediti, interviste, influenze. Da dove viene questo disco e dove porta."}
];
const LENS=Object.fromEntries(LENSES.map(l=>[l.id,l]));
const MAX=8, ROT=3, KEEP=90, GRACE=30;
/* giorni da aspettare per salire dalla tappa n alla n+1; un ascolto conta già dal 60% dell'attesa */
const GAP=[0,2,3,5,7,14,21,30];
/* tappe 1–3 (conoscere il disco) si possono fare anche di passaggio; dalla 4 in su serve un ascolto attento */
const LIGHT_UNTIL=3;
const DAY={piena:{name:"Piena",desc:"al massimo uno di passaggio",a:0,p:1},normale:{name:"Normale",desc:"un ascolto attento",a:1,p:0},buona:{name:"Buona",desc:"uno attento e due di passaggio",a:1,p:2}};
const MOMENTS={mattina:"mattina",pomeriggio:"pomeriggio",sera:"sera",notte:"notte"};

/* illustrazioni: linea sottile in currentColor, viewBox 120×120 */
const ILL={
  disco:'<g class="spin"><circle class="paper" cx="74" cy="60" r="30"/><path d="M74 38a22 22 0 0 1 22 22M74 82a22 22 0 0 1-22-22" stroke-width="1.4"/><path d="M74 45a15 15 0 0 1 15 15" stroke-width="1.4"/><circle class="fill" cx="74" cy="60" r="8"/><circle class="paper" cx="74" cy="60" r="1.8" stroke="none"/></g><g transform="rotate(-7 34 62)"><rect class="paper" x="6" y="32" width="52" height="58" rx="3"/><path d="M15 46h24M15 54h15" stroke-width="1.6"/><circle cx="46" cy="77" r="5" stroke-width="1.6"/></g><path d="M108 40l7-4M110 58h8M108 76l7 4" stroke-width="1.8"/>',
  pila:'<g transform="rotate(-14 44 70)"><rect class="paper" x="18" y="38" width="48" height="50" rx="3"/><path d="M26 50h18" stroke-width="1.6"/></g><g transform="rotate(9 76 70)"><circle cx="84" cy="56" r="20"/><circle class="fill" cx="84" cy="56" r="5"/><rect class="paper" x="52" y="40" width="48" height="50" rx="3"/><path d="M60 52h22M60 59h12" stroke-width="1.6"/></g><rect class="paper" x="36" y="46" width="48" height="50" rx="3"/><circle cx="60" cy="71" r="13" stroke-width="1.6"/><circle class="fill" cx="60" cy="71" r="3.4"/><path d="M14 100h92"/>',
  rete:'<path d="M30 40c18 26 46-14 60 10M34 46c4 30 26 38 44 34M88 58c4 14-2 24-10 26" stroke-width="1.5" stroke-dasharray="3 4"/><circle class="paper" cx="28" cy="38" r="15"/><circle class="fill" cx="28" cy="38" r="4"/><circle class="paper" cx="90" cy="52" r="12"/><circle class="fill" cx="90" cy="52" r="3.2"/><circle class="paper" cx="70" cy="88" r="17"/><circle cx="70" cy="88" r="10" stroke-width="1.4"/><circle class="fill" cx="70" cy="88" r="4.4"/>',
  quaderno:'<path d="M60 38c-12-8-30-9-44-4v58c14-5 32-4 44 4 12-8 30-9 44-4V34c-14-5-32-4-44 4z"/><path d="M60 38v58"/><path d="M26 48c8-2 16-2 24 1M26 58c8-2 16-2 24 1M26 68c6-1 12-1 18 0M70 49c8-3 16-3 24-1M70 59c6-2 12-2 18-1" stroke-width="1.5"/><g transform="rotate(38 86 70)"><rect class="paper" x="80" y="40" width="11" height="52" rx="2"/><path d="M80 92l5.5 11 5.5-11M80 50h11"/></g>',
  metronomo:'<path d="M42 100l14-72h8l14 72z"/><path d="M36 100h48"/><path d="M60 92L80 38" stroke-width="2"/><rect class="fill" x="70" y="52" width="9" height="7" rx="1.5" transform="rotate(20 74.5 55.5)"/><path d="M50 82h20" stroke-width="1.5"/><path d="M90 30l6-6M94 42l8-2M24 36l-6-5" stroke-width="1.6"/>',
  cuffie:'<path d="M28 70c0-38 64-38 64 0"/><path d="M33 68c0-30 54-30 54 0" stroke-width="1.4"/><rect class="fill" x="20" y="64" width="16" height="30" rx="7"/><rect class="fill" x="84" y="64" width="16" height="30" rx="7"/><path d="M14 104h92"/><path d="M96 34l7-2-3 7 7-2M104 18l5-1-2 5 5-1" stroke-width="1.6"/>',
  giradischi:'<rect x="10" y="34" width="100" height="62" rx="6"/><circle class="paper" cx="50" cy="64" r="24"/><g class="spin"><circle cx="50" cy="64" r="24"/><path d="M50 46a18 18 0 0 1 18 18" stroke-width="1.4"/><circle class="fill" cx="50" cy="64" r="6"/></g><circle cx="94" cy="44" r="4"/><path d="M94 48l-4 24-14 8" stroke-width="2.4"/><path d="M84 88h16M18 96v6M102 96v6" stroke-width="1.6"/>'
};
function ill(name){return '<svg class="ill" viewBox="0 0 120 120" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#hand)">'+ILL[name]+'</svg>';}

/* il colore del mese: una coppia carta/inchiostro, come i calendari svizzeri */
const MONTHS=[["#E7E3DC","#3D3A36"],["#E4E0EA","#4A3D6B"],["#DDE8DA","#2F5B33"],["#E7E9C6","#4D5810"],["#F2E3DA","#A82317"],["#D8E6F2","#1F4F8A"],["#ECEEF3","#2C46B1"],["#F6DAD6","#962636"],["#D7E8E4","#1E5B54"],["#F7DCC8","#9C3009"],["#DCE6EE","#24527A"],["#F4E2A6","#664700"]];
function applyMonth(){
  const m=new Date().getMonth(),[paper,ink]=MONTHS[m],r=document.documentElement.style;
  r.setProperty("--hue-paper",paper);r.setProperty("--hue-ink",ink);
  const dark=matchMedia("(prefers-color-scheme: dark)").matches;
  const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),mix=(a,b,t)=>"#"+a.map((v,i)=>Math.round(v*t+b[i]*(1-t)).toString(16).padStart(2,"0")).join("");
  const tc=document.getElementById("theme-color");if(tc)tc.content=dark?mix(hex(ink),[12,12,12],.3):paper;
  const el=document.getElementById("month");if(el)el.textContent=new Date().toLocaleDateString("it-IT",{month:"long"});
}
applyMonth();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyMonth);

let db=null, discs=new Map(), listens=[], loaded={d:false,l:false};
const ui={tab:"oggi",sel:null,openHist:new Set(),day:"normale"};
try{const t=localStorage.getItem("ascolta-tab");if(t)ui.tab=t;const d=JSON.parse(localStorage.getItem("ascolta-day")||"null");if(d&&d.date===todayStr()&&DAY[d.type])ui.day=d.type;}catch(e){}

/* ---------- date ---------- */
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dnum(s){const [y,m,d]=s.split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5);}
function dstr(n){return new Date(n*864e5).toISOString().slice(0,10);}
function fmt(n,opt){return new Date(n*864e5).toLocaleDateString("it-IT",Object.assign({day:"numeric",month:"short",timeZone:"UTC"},opt||{}));}
function rel(n){const d=n-dnum(todayStr());if(d===0)return"oggi";if(d===1)return"domani";if(d===-1)return"ieri";return d>0?"tra "+d+" giorni":-d+" giorni fa";}
const TODAY=()=>dnum(todayStr());

/* ---------- il cuore: tappe, intensità, quando è pronto ---------- */
const cache=new Map();
function progress(d){
  if(cache.has(d.id))return cache.get(d.id);
  const ls=listens.filter(l=>l.disc===d.id).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0));
  let stage=0,lastStep=null,last=null;const used=new Set(),cnt={};
  if(d.baseStage>0){stage=Math.min(MAX,d.baseStage);if(d.baseDate){lastStep=last=dnum(d.baseDate);}}
  for(const l of ls){
    const n=dnum(l.date),att=(l.type||"attento")==="attento";
    if(att&&l.lens&&LENS[l.lens]){used.add(l.lens);cnt[l.lens]=(cnt[l.lens]||0)+1;}
    if(stage===0){stage=1;lastStep=n;}
    else if(lastStep===null){lastStep=n;}
    else if(stage<MAX&&n-lastStep>=Math.ceil(GAP[stage]*0.6)&&(att||stage<LIGHT_UNTIL)){stage++;lastStep=n;}
    last=last===null?n:Math.max(last,n);
  }
  const T=TODAY();
  const full=stage>=MAX;
  const depth=stage/MAX*0.75+used.size/LENSES.length*0.25;
  let intensity=depth,nextDue=null,earliest=null,overdue=0,fading=false;
  if(lastStep!==null){
    nextDue=full?last+KEEP:lastStep+GAP[stage];
    earliest=full?nextDue:lastStep+Math.ceil(GAP[stage]*0.6);
    overdue=T-nextDue;
    /* il tempo per sbiadire parte al più presto dal giorno in cui il disco è entrato in studio: l'attesa in coda non conta */
    const late=T-Math.max(nextDue,d.enteredAt?dnum(d.enteredAt):nextDue);
    if(d.status==="studio"&&late>GRACE){fading=true;intensity=depth*(1-0.5*Math.min(1,(late-GRACE)/60));}
  }
  const fresh=LENSES.find(x=>!used.has(x.id));
  const sug=stage===0?LENS.insieme:(fresh||LENSES.slice().sort((a,b)=>(cnt[a.id]||0)-(cnt[b.id]||0))[0]);
  const heardToday=ls.some(l=>l.date===todayStr());
  const p={stage,depth,intensity,nextDue,earliest,overdue,fading,used,sug,ls,last,full,heardToday,
    phase:stage<4?"primo":full?"full":"rot",
    lightOk:stage<LIGHT_UNTIL,
    ready:stage===0||lastStep===null||T>=earliest};
  cache.set(d.id,p);return p;
}
function isActive(d){return d.status==="studio";}
function isDiscovery(d){return d.status==="scoperta";}
function inQueue(d){return d.status==="coda"||d.status==="radar";}

/* ---------- il flusso: chi è in primo piano, chi in rotazione, chi aspetta ---------- */
function flow(){
  const act=[...discs.values()].filter(isActive).map(d=>({d,p:progress(d)}));
  const primo=act.filter(x=>x.p.phase==="primo").sort((a,b)=>(a.d.createdAt||0)-(b.d.createdAt||0));
  const rot=act.filter(x=>x.p.phase==="rot").sort((a,b)=>(a.p.nextDue??0)-(b.p.nextDue??0));
  const full=act.filter(x=>x.p.phase==="full");
  const coda=[...discs.values()].filter(inQueue).sort((a,b)=>(a.order||0)-(b.order||0)||(a.createdAt||0)-(b.createdAt||0));
  const canEnter=primo.length===0&&rot.length<ROT;
  const entering=canEnter&&coda[0]?{d:coda[0],p:progress(coda[0]),entering:true}:null;
  let waitWhy="";
  if(!canEnter&&coda[0])waitWhy=primo.length?"Entra quando "+primo[0].d.title+" passa in rotazione, alla tappa 4.":"Entra quando si libera un posto in rotazione.";
  return {act,primo,rot,full,coda,canEnter,entering,waitWhy};
}
function branchSlots(stage){return stage>=8?6:stage>=6?4:stage>=4?2:0;}
function childrenOf(id){return [...discs.values()].filter(d=>d.parent===id&&(isActive(d)||inQueue(d)));}
function seedsOf(id){return [...discs.values()].filter(d=>d.parent===id&&d.status==="seme").sort((a,b)=>(a.order||0)-(b.order||0));}

/* ---------- il piano di oggi, dentro la capienza della giornata ---------- */
function todayPlan(){
  const F=flow(),cap=DAY[ui.day],td=todayStr();
  const todays=listens.filter(l=>l.date===td);
  const doneA=todays.filter(l=>(l.type||"attento")==="attento").length, doneP=todays.length-doneA;
  const pool=[...F.primo,...(F.entering?[F.entering]:[]),...F.rot,...F.full].filter(x=>!x.p.heardToday);
  const T=TODAY();
  const att=pool.filter(x=>!x.p.full&&x.p.ready).sort((a,b)=>(a.p.phase==="primo"?0:1)-(b.p.phase==="primo"?0:1)||(b.p.overdue||0)-(a.p.overdue||0));
  const attPick=att.slice(0,Math.max(0,cap.a-doneA)).map(x=>({...x,kind:"attento",why:x.p.stage===0?"Primo ascolto: entra in primo piano. Lente "+x.p.sug.name+".":"Porta alla tappa "+(x.p.stage+1)+". Lente "+x.p.sug.name+"."}));
  const taken=new Set(attPick.map(x=>x.d.id));
  const pas=[];
  for(const x of pool){if(taken.has(x.d.id))continue;
    if(x.p.lightOk&&x.p.ready)pas.push({...x,rank:0,why:x.p.stage===0?"Primo contatto con il disco, anche distratto va bene.":"Anche distratto, porta alla tappa "+(x.p.stage+1)+"."});
    else if(x.p.full&&T>=x.p.nextDue)pas.push({...x,rank:1,why:"Richiamo: un ripasso leggero per non perderlo."});
    else if(!x.p.full&&x.p.last!==null&&T-x.p.last>=5)pas.push({...x,rank:2,why:"Per tenerlo vivo tra una tappa e l'altra. Non fa salire di tappa."});
  }
  pas.sort((a,b)=>a.rank-b.rank||(a.p.last??0)-(b.p.last??0));
  const pasPick=pas.slice(0,Math.max(0,cap.p-doneP)).map(x=>({...x,kind:"passaggio"}));
  const nextAtt=att.length?null:pool.filter(x=>!x.p.full&&x.p.earliest!==null).sort((a,b)=>a.p.earliest-b.p.earliest)[0]||null;
  return {F,cap,todays,doneA,doneP,attPick,pasPick,nextAtt};
}

/* ---------- utilità ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3600);}
function writeErr(e){
  if(e&&e.code==="quota_exceeded")toast("Lo spazio del diario è pieno. Elimina qualche voce vecchia e riprova.");
  else toast("Non ho potuto salvare. Controlla la connessione e riprova.");
}

/* ---------- componenti ---------- */
function bar(p,small){
  const pct=Math.round(p.intensity*100),k=Math.round(14+p.intensity*86);
  let s='<div class="bar" role="img" aria-label="Tappa '+p.stage+' di 8, intensità '+pct+' per cento">';
  for(let i=1;i<=MAX;i++)s+='<i'+(i<=p.stage?' class="on" style="--k:'+k+'%"':'')+'></i>';
  s+='</div>';
  if(!small)s='<div class="bar-meta"><span class="big">'+p.stage+'<small>/8</small></span><span>intensità '+pct+'%'+(p.fading?' · sta sbiadendo':'')+'</span></div>'+s;
  return s;
}
function lensDots(p){return '<div class="lenses" aria-label="Lenti già usate">'+LENSES.map(l=>'<span class="'+(p.used.has(l.id)?"on":"")+'">'+esc(l.name)+'</span>').join("")+'</div>';}
function phasePill(d,p){
  if(isDiscovery(d))return '<span class="pill coda">scoperta</span>';
  if(!isActive(d))return '<span class="pill coda">in coda</span>';
  return {primo:'<span class="pill primo">primo piano</span>',rot:'<span class="pill rot">rotazione</span>',full:'<span class="pill full">interiorizzato</span>'}[p.phase];
}
function readyLine(d,p){
  if(isDiscovery(d))return '<p class="next muted">Ascoltato '+(p.last!==null?fmt(p.last):'')+'. Se vuoi studiarlo, mettilo in coda: gli ascolti già fatti contano.</p>';
  if(!isActive(d))return '<p class="next muted">Aspetta il suo turno in coda.'+(p.ls.length?' Gli ascolti già fatti contano.':'')+'</p>';
  if(p.stage===0||p.nextDue===null)return '<p class="next"><b>Pronto</b> per il primo ascolto.</p>';
  const T=TODAY();
  if(p.full)return '<p class="next">Richiamo leggero '+(T>=p.nextDue?'<b>quando vuoi</b>':'dal <b>'+fmt(p.nextDue)+'</b>')+'.</p>';
  const how=p.lightOk?"anche di passaggio":"ascolto attento";
  if(T>=p.earliest)return '<p class="next"><b>Pronto</b> per la tappa '+(p.stage+1)+' ('+how+', lente '+esc(p.sug.name)+').</p>';
  return '<p class="next">Tappa '+(p.stage+1)+' dal <b>'+fmt(p.earliest)+'</b> ('+rel(p.earliest)+', '+how+').</p>';
}
function card(d){
  const p=progress(d),par=d.parent&&discs.get(d.parent),hist=ui.openHist.has(d.id);
  return '<article class="card">'+
   '<div class="card-head"><div><h3>'+esc(d.title)+'</h3><div class="artist">'+esc(d.artist)+(d.year?' · '+esc(d.year):'')+'</div></div>'+phasePill(d,p)+'</div>'+
   (par?'<div class="from">↳ dalla rete di '+esc(par.title)+'</div>':'')+
   (isActive(d)?bar(p)+lensDots(p):(d.why?'<p class="muted" style="font-size:.9rem">'+esc(d.why)+'</p>':''))+
   readyLine(d,p)+
   '<div class="actions">'+
    (isActive(d)?'<button class="btn small" data-act="log" data-id="'+esc(d.id)+'">Segna ascolto</button>':'')+
    (isDiscovery(d)?'<button class="btn small" data-act="queue" data-id="'+esc(d.id)+'">Metti in coda</button><button class="btn small ghost" data-act="log" data-id="'+esc(d.id)+'" data-type="passaggio">Riascoltato</button><button class="btn small ghost" data-act="unqueue" data-id="'+esc(d.id)+'">Togli</button>':'')+
    (p.ls.length?'<button class="btn small ghost" data-act="hist" data-id="'+esc(d.id)+'" aria-expanded="'+hist+'">'+(hist?'Chiudi':'Storia')+' ('+p.ls.length+')</button>':'')+
   '</div>'+
   (hist?'<ul class="history">'+p.ls.slice().reverse().map(l=>'<li><span class="mono">'+fmt(dnum(l.date))+' · '+esc(MOMENTS[l.moment]||"")+' · '+((l.type||"attento")==="attento"?esc(LENS[l.lens]?.name||"attento"):"di passaggio")+'</span>'+(l.track?'<br>♪ '+esc(l.track):'')+(l.note?'<span class="nota" style="margin-top:6px">'+esc(l.note)+'</span>':'')+'</li>').join("")+'</ul>':'')+
  '</article>';
}
function mini(x,extra){

let sim=null;
function drawGraph(){
  const svg=document.getElementById("graph");if(!svg)return;
  if(sim){sim.stop();sim=null;}
  if(!window.d3){svg.outerHTML='<p class="empty">Non riesco a caricare il disegno della rete. Ricarica la pagina.</p>';return;}
  const nodes=[...discs.values()].filter(d=>isActive(d)||inQueue(d)).map(d=>({id:d.id,d,p:progress(d)}));
  const ids=new Set(nodes.map(n=>n.id));
  const links=nodes.filter(n=>n.d.parent&&ids.has(n.d.parent)).map(n=>({source:n.d.parent,target:n.id}));
  const W=svg.clientWidth||700,H=svg.clientHeight||560;
  const s=d3.select(svg).attr("viewBox",[0,0,W,H]);s.selectAll("*").remove();
  if(!nodes.length){s.append("text").attr("x",W/2).attr("y",H/2).attr("text-anchor","middle").attr("class","node-label").text("La rete compare quando aggiungi il primo disco");return;}
  const g=s.append("g");
  s.call(d3.zoom().scaleExtent([.4,3]).on("zoom",e=>g.attr("transform",e.transform)));
  const r=n=>9+n.p.stage*2.2;
  const fill=n=>!isActive(n.d)?"var(--card)":"color-mix(in oklab,var(--deep) "+Math.round(14+n.p.intensity*86)+"%,var(--groove))";
  const stroke=n=>n.id===ui.sel?"var(--amber)":!isActive(n.d)?"var(--muted)":"var(--ink)";
  const link=g.append("g").selectAll("line").data(links).join("line").style("stroke","var(--line)").attr("stroke-width",1.5);
  const node=g.append("g").selectAll("g").data(nodes).join("g").style("cursor","pointer")
    .attr("tabindex",0).attr("role","button").attr("aria-label",n=>n.d.title+", "+n.d.artist)
    .on("click",(e,n)=>select(n.id)).on("keydown",(e,n)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(n.id);}});
  node.append("circle").attr("r",r).style("fill",fill).style("stroke",stroke).attr("stroke-width",n=>n.id===ui.sel?3:1.2).attr("stroke-dasharray",n=>isActive(n.d)?null:"3 3");
  node.append("text").attr("class","node-label").attr("dy",n=>r(n)+13).attr("text-anchor","middle").text(n=>n.d.title.length>26?n.d.title.slice(0,25)+"…":n.d.title);
  node.call(d3.drag().on("start",(e,n)=>{if(!e.active)sim.alphaTarget(.3).restart();n.fx=n.x;n.fy=n.y;}).on("drag",(e,n)=>{n.fx=e.x;n.fy=e.y;}).on("end",(e,n)=>{if(!e.active)sim.alphaTarget(0);n.fx=null;n.fy=null;}));
  sim=d3.forceSimulation(nodes).force("link",d3.forceLink(links).id(n=>n.id).distance(95)).force("charge",d3.forceManyBody().strength(-320))
    .force("center",d3.forceCenter(W/2,H/2)).force("collide",d3.forceCollide().radius(n=>r(n)+18))
    .on("tick",()=>{link.attr("x1",l=>l.source.x).attr("y1",l=>l.source.y).attr("x2",l=>l.target.x).attr("y2",l=>l.target.y);node.attr("transform",n=>"translate("+n.x+","+n.y+")");});
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){sim.stop();for(let i=0;i<200;i++)sim.tick();sim.on("tick")();}
}

  const wk=listens.filter(l=>T-dnum(l.date)<7&&T-dnum(l.date)>=0);
  const n=(v,l)=>'<div><b>'+v+'</b><span>'+l+'</span></div>';
  return '<div class="stats" aria-live="polite">'+n(F.rot.length+'/'+ROT,"in rotazione")+n(wk.length,"ascolti 7 gg")+n(wk.filter(l=>(l.type||"attento")==="attento").length,"attenti")+n(F.full.length,"interiorizzati")+'</div>';
}
function render(){
  if(!(loaded.d&&loaded.l))return;
  cache.clear();
  document.querySelectorAll(".tab[data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===ui.tab));
  const V={oggi:vOggi,dischi:vDischi,rete:vRete,diario:vDiario,metodo:vMetodo};
  const keepAdd=document.getElementById("add-box")?.open,y=window.scrollY;
  $("#main").innerHTML=(V[ui.tab]||vOggi)();
  if(keepAdd&&document.getElementById("add-box"))document.getElementById("add-box").open=true;
  window.scrollTo(0,y);
  if(ui.tab==="rete")drawGraph();
}
function setTab(t){ui.tab=t;try{localStorage.setItem("ascolta-tab",t);}catch(e){}window.scrollTo(0,0);render();}

/* ---------- dialog ascolto ---------- */
function openLog(id,type){
  if(!db){toast("Accedi per salvare gli ascolti.");return;}
  const F=flow();
  const act=[...F.primo,...F.rot,...F.full].map(x=>x.d);
  const sc=[...discs.values()].filter(isDiscovery);
  const opt=d=>'<option value="'+esc(d.id)+'">'+esc(d.title)+' · '+esc(d.artist)+'</option>';
  $("#lf-disc").innerHTML='<option value="__new">＋ Un disco nuovo, mai segnato prima</option>'+
    (act.length?'<optgroup label="In ascolto">'+act.map(opt).join("")+'</optgroup>':'')+
    (F.coda.length?'<optgroup label="In coda">'+F.coda.map(opt).join("")+'</optgroup>':'')+
    (sc.length?'<optgroup label="Scoperte">'+sc.map(opt).join("")+'</optgroup>':'');
  const fallback=F.primo[0]?.d.id||F.entering?.d.id||act[0]?.id||"__new";
  $("#lf-disc").value=id==="__new"||(id&&discs.get(id))?id:fallback;
  ["#lf-n-title","#lf-n-artist","#lf-n-year"].forEach(s=>$(s).value="");$("#lf-n-dest").value="scoperta";
  $("#lf-lens").innerHTML=LENSES.map(l=>'<option value="'+l.id+'">'+esc(l.name)+'</option>').join("");
  (type==="passaggio"?$("#lf-t-pas"):$("#lf-t-att")).checked=true;
  $("#lf-date").value=todayStr();$("#lf-date").max=todayStr();
  const h=new Date().getHours();$("#lf-moment").value=h<12?"mattina":h<18?"pomeriggio":h<23?"sera":"notte";
  $("#lf-track").value="";$("#lf-note").value="";
  syncLens();
  const dlg=$("#dlg");if(dlg.showModal)dlg.showModal();else dlg.setAttribute("open","");
}
function curType(){return $("#lf-t-pas").checked?"passaggio":"attento";}
function syncLens(){
  const v=$("#lf-disc").value,isNew=v==="__new";$("#lf-new").hidden=!isNew;
  const d=discs.get(v);$("#lf-lens").value=d?progress(d).sug.id:"insieme";syncType();
  if(isNew)setTimeout(()=>$("#lf-n-title").focus(),0);
}
function syncType(){const att=curType()==="attento";$("#lf-lens-wrap").hidden=!att;const l=LENS[$("#lf-lens").value];$("#lf-hint").textContent=att?(l?l.hint:""):"Niente lente: basta lasciarlo girare.";}
function closeLog(){const dlg=$("#dlg");if(dlg.close)dlg.close();else dlg.removeAttribute("open");}
$("#lf-disc").addEventListener("change",syncLens);
$("#lf-lens").addEventListener("change",syncType);
$("#lf-t-att").addEventListener("change",syncType);
$("#lf-t-pas").addEventListener("change",syncType);
$("#lf-cancel").addEventListener("click",closeLog);
let saving=false;
$("#log-form").addEventListener("submit",async e=>{
  e.preventDefault();if(saving)return;
  let id=$("#lf-disc").value;const date=$("#lf-date").value,type=curType(),isNew=id==="__new";
  if(!id||!/^\d{4}-\d{2}-\d{2}$/.test(date)){toast("Scegli un disco e un giorno.");return;}
  if(date>todayStr()){toast("Il giorno non può essere nel futuro.");return;}
  const nt=$("#lf-n-title").value.trim(),na=$("#lf-n-artist").value.trim(),dest=$("#lf-n-dest").value;
  if(isNew&&(!nt||!na)){toast("Scrivi titolo e artista del disco nuovo.");return;}
  const d=isNew?null:discs.get(id);if(!isNew&&!d)return;
  cache.clear();const before=d?progress(d).stage:0;
  const entering=flow().entering;
  saving=true;$("#lf-save").disabled=true;
  try{
    if(isNew){
      const ref=await db.collection("dischi").add({title:nt,artist:na,year:$("#lf-n-year").value.trim(),parent:null,status:dest,baseStage:0,why:"",order:dest==="coda"?maxOrder()+1:0,createdAt:Date.now()});
      id=ref.id;
    } else if(inQueue(d)&&entering&&entering.d.id===id){
      /* è il primo della coda e c'è posto: entra in primo piano */
      const patch={status:"studio",enteredAt:date};
      /* un disco che conosci già: la base si colloca appena prima di questo ascolto, così l'ascolto conta come tappa successiva */
      if(d.baseStage>0&&!d.baseDate)patch.baseDate=dstr(dnum(date)-GAP[Math.min(MAX-1,d.baseStage)]);
      await db.doc("dischi/"+id).update(patch);
    }
    await db.collection("ascolti").add({disc:id,date,type,moment:$("#lf-moment").value,lens:type==="attento"?$("#lf-lens").value:null,track:$("#lf-track").value.trim().slice(0,200),note:$("#lf-note").value.trim().slice(0,4000),createdAt:Date.now()});
    closeLog();
    setTimeout(()=>{cache.clear();const dd=discs.get(id);if(!dd)return;const p=progress(dd);
      if(isNew){toast(dest==="coda"?"Disco aggiunto in coda, con il primo ascolto già fatto.":"Salvato tra le scoperte. Lo trovi in Dischi.");return;}
      if(!isActive(dd)){toast(isDiscovery(dd)?"Riascolto salvato tra le scoperte.":"Salvato. Resta in coda, e questo ascolto conterà quando entra.");return;}
      if(p.stage>before){
        toast("Tappa "+p.stage+" raggiunta"+(p.full?": disco interiorizzato!":p.stage===4?": passa in rotazione.":"."));
      } else toast(type==="passaggio"&&!p.lightOk&&!p.full?"Salvato. Lo tiene vivo, ma per la prossima tappa serve un ascolto attento.":"Ascolto salvato nel diario.");
    },400);
  }catch(err){writeErr(err);}
  finally{saving=false;$("#lf-save").disabled=false;}
});

/* ---------- azioni ---------- */
const pendingDel={};
function minOrder(){return Math.min(0,...[...discs.values()].filter(inQueue).map(d=>d.order||0));}
function maxOrder(){return Math.max(0,...[...discs.values()].filter(inQueue).map(d=>d.order||0));}
document.addEventListener("click",async e=>{
  const tab=e.target.closest(".tab[data-tab]");if(tab){setTab(tab.dataset.tab);return;}
  const dt=e.target.closest("[data-day]");if(dt){ui.day=dt.dataset.day;try{localStorage.setItem("ascolta-day",JSON.stringify({date:todayStr(),type:ui.day}));}catch(err){}render();return;}
  if(e.target.closest("#log-any")){openLog(ui.sel);return;}
  const b=e.target.closest("[data-act]");if(!b)return;
  const id=b.dataset.id,act=b.dataset.act;
  if(act==="log")return openLog(id,b.dataset.type);
  if(act==="logany")return openLog();
  if(act==="hist"){ui.openHist.has(id)?ui.openHist.delete(id):ui.openHist.add(id);if(ui.tab==="rete")$("#side").innerHTML=card(discs.get(id));else render();return;}
  if(!db){toast("Accedi per salvare.");return;}
  b.disabled=true;
  try{
    const d=discs.get(id);
    if(act==="queue"){await db.doc("dischi/"+id).update({status:"coda",order:maxOrder()+1});toast("In coda. Entra appena si libera il posto.");}
    else if(act==="later"){const max=Math.max(0,...seedsOf(d.parent).map(s=>s.order||0));await db.doc("dischi/"+id).update({order:max+1});toast("Lo rimetto in fondo tra i semi.");}
    else if(act==="top"){await db.doc("dischi/"+id).update({order:minOrder()-1});toast("Ora è il primo della coda.");}
    else if(act==="unqueue"){await db.doc("dischi/"+id).update({status:d.parent?"seme":"archivio"});toast(d.parent?"Torna tra i semi della sua rete.":"Tolto dalla coda.");}
    else if(act==="del"){
      if(!pendingDel[id]){pendingDel[id]=setTimeout(()=>{delete pendingDel[id];b.textContent="Elimina";b.classList.remove("warn");},4000);b.textContent="Conferma eliminazione";b.classList.add("warn");b.disabled=false;return;}
      clearTimeout(pendingDel[id]);delete pendingDel[id];await db.doc("ascolti/"+id).delete();toast("Ascolto eliminato.");
    }
  }catch(err){writeErr(err);b.disabled=false;}
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="add-form")return;e.preventDefault();
  if(!db){toast("Accedi per salvare.");return;}
  const title=$("#af-title").value.trim(),artist=$("#af-artist").value.trim();
  if(!title||!artist){toast("Servono almeno titolo e artista.");return;}
  try{
    const top=$("#af-pos").value==="top";
    await db.collection("dischi").add({title,artist,year:$("#af-year").value.trim(),parent:$("#af-parent").value||null,status:"coda",baseStage:Number($("#af-base").value)||0,why:$("#af-why").value.trim(),order:top?minOrder()-1:maxOrder()+1,createdAt:Date.now()});
    e.target.reset();toast(top?"Aggiunto come primo della coda.":"Aggiunto in fondo alla coda.");
  }catch(err){writeErr(err);}
});

/* ---------- avvio ---------- */
let refreshDay=todayStr();
setInterval(()=>{if(todayStr()!==refreshDay){refreshDay=todayStr();ui.day="normale";applyMonth();render();}},60000);
function showLogin(){
  $("#main").innerHTML='<section class="block login">'+ill("giradischi")+'<div class="block-head"><h2>Entra in Ascolta</h2><p>Email e password dell\'utente creato su Supabase. Lo fai una volta sola su ogni dispositivo.</p></div>'+
   '<form id="lg-form" novalidate><label class="f" for="lg-email">Email<input type="email" id="lg-email" autocomplete="username" required></label><label class="f" for="lg-pass">Password<input type="password" id="lg-pass" autocomplete="current-password" required></label><div class="actions"><button class="btn" type="submit">Entra</button></div></form></section>';
  $("#lg-form").addEventListener("submit",async e=>{
    e.preventDefault();const email=$("#lg-email").value.trim(),pass=$("#lg-pass").value;
    if(!email||!pass){toast("Scrivi email e password.");return;}
    const b=e.submitter;b.disabled=true;
    try{await Store.signIn(email,pass);start();}
    catch(err){toast(navigator.onLine?"Email o password non corrette.":"Serve la connessione per il primo accesso.");console.warn(err);b.disabled=false;}
  });
}
function start(){
  db=Store;
  $("#main").innerHTML='<div class="empty"><b>Sto aprendo i tuoi dischi…</b></div>';
  db.collection("dischi").limit(1000).onSnapshot(snap=>{discs=new Map(snap.docs.map(d=>[d.id,Object.assign({id:d.id},d.data())]));loaded.d=true;render();});
  db.collection("ascolti").limit(1000).onSnapshot(snap=>{listens=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(l=>typeof l.disc==="string"&&typeof l.date==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(l.date));loaded.l=true;render();});
  Store.onStatus(st=>{$("#sync").textContent=!st.online?(st.pending?"offline · "+st.pending+" da inviare":"offline"):st.pending?st.pending+" da inviare":st.error?"non sincronizzato":"";});
  Store.start();
}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(e=>console.warn("Ascolta: niente modalità offline",e));
(async()=>{
  let s=null;try{s=await Store.session();}catch(e){}
  if(s)start();else showLogin();
})();
</script>
